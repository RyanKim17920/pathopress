[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathopress"
version = "0.1.0"
description = "Citation-backed matrix completion for pathology foundation-model benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
confidence = ["scikit-learn>=1.3"]
hf = ["pyarrow>=15", "huggingface_hub>=0.24"]
test = ["pytest>=8", "pyarrow>=15"]
# Reproduces the complete research grid, including the deliberately optional
# PyTorch MLP shard. Core matrix completion remains NumPy-only.
research = [
  "matplotlib>=3.8",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
]

[project.scripts]
pathopress = "pathopress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
