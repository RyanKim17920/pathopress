[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathopress"
version = "0.1.0"
description = "Citation-backed matrix completion for pathology foundation-model benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
pathopress = "pathopress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

