[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathopress"
version = "0.1.0"
description = "Citation-backed matrix completion for pathology foundation-model benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
confidence = ["scikit-learn>=1.3"]
hf = ["pyarrow>=15", "huggingface_hub>=0.24"]
evidence = ["openpyxl>=3.1"]
test = ["pytest>=8", "pyarrow>=15"]
# Research analysis and plotting dependencies. Core matrix completion remains
# NumPy-only; the deliberately optional PyTorch MLP shard has its own extra.
research = [
  "matplotlib>=3.8",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]
mlp = ["torch>=2.0"]

[project.scripts]
pathopress = "pathopress.cli:main"
# Packaged front end for the reproduction pipeline.  These wrap the scripts in
# `scripts/` and `experiments/` without replacing them: the documented
# `python3 scripts/<name>.py` invocations keep working unchanged, and
# `experiments/experiment_set.json` still records those literal commands.
pathopress-run = "pathopress.workflows:main"
pathopress-replay = "pathopress.workflows:replay_lofo_matched_cells"
pathopress-check-freshness = "pathopress.workflows:check_freshness"
pathopress-build-release = "pathopress.workflows:build_public_release"
pathopress-download-release = "pathopress.workflows:download_public_release"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The package is fully annotated (`from __future__ import annotations` plus
# parameter/return hints throughout), so ship the PEP 561 marker.
pathopress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
