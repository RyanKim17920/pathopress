name: CI

# Quoted so YAML 1.1 parsers do not fold the key into the boolean `true`.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref; the freshness check reads a large
# artifact and there is no value in racing two of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests + artifact freshness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # uv owns the Python toolchain here, so there is no actions/setup-python
      # step: `python-version` below makes setup-uv provision and pin the
      # interpreter (UV_PYTHON) that every later `uv` command uses.
      #
      # pyproject.toml declares requires-python = ">=3.10". We pin the concrete
      # 3.13 series because that is what the project is developed and validated
      # against locally (.venv is CPython 3.13.x); >=3.10 is the support floor,
      # not the tested configuration.
      # `version` is pinned rather than `latest`: a floating uv release can
      # change resolution or lockfile handling and turn CI red for a reason
      # unrelated to this repository's contents.
      - name: Install uv
        # setup-uv stopped publishing moving major tags after v7, so this is
        # pinned to the exact release tag; `@v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails loudly if uv.lock has drifted from pyproject.toml rather
      # than silently re-resolving. Extras are listed explicitly instead of
      # --all-extras so the heavyweight, deliberately optional `mlp` extra
      # (torch) stays out of CI; nothing under tests/ imports torch.
      - name: Sync dependencies
        run: >-
          uv sync --locked
          --extra test
          --extra plots
          --extra confidence
          --extra research
          --extra evidence
          --extra hf

      - name: Run tests
        run: uv run pytest tests/ -q

      # experiments/experiment_set_dry_run.json is a committed artifact that the
      # freshness check below can only confirm is unmodified. Regenerating it
      # here and requiring a clean diff upgrades that hash comparison into a
      # real check that the declared experiment set still resolves: every input,
      # dependency and artifact each component claims must still exist on disk.
      # Hermetic (no network, reads only tracked files) and ~0.6 s.
      - name: Re-derive the experiment-set dry run
        run: |
          uv run python scripts/dry_run_experiment_set.py > /dev/null
          git diff --exit-code -- experiments/experiment_set_dry_run.json

      # ~0.3 s, no network. Overlaps tests/test_score_review.py but is not
      # redundant with it: the test asserts a subset of the summary fields,
      # while this requires every key of the recomputed ledger summary to equal
      # the committed data/score_review_summary.json.
      - name: Validate the score-review ledger
        run: uv run python scripts/validate_score_review_ledger.py > /dev/null

      # Verifies the hash-bound manifest in
      # experiments/artifact_freshness_manifest.json still matches the committed
      # artifacts. This reads experiments/probe_compression_rank1.json (~26 MB),
      # so it is the slowest step; it is intentionally run plainly, with no
      # continue-on-error, because a stale manifest is a real failure that must
      # block the merge.
      - name: Check artifact freshness
        run: uv run python scripts/check_artifact_freshness.py check

  # NOTE: the extraction-fidelity tests skip in this job because the pinned
  # upstream checkouts they read are not vendored. They are exercised by
  # .github/workflows/provenance.yml, which provisions those checkouts and
  # fails rather than skips. That workflow is scheduled and manually
  # dispatchable and must stay out of this gate: it depends on eight external
  # repositories staying reachable at fixed SHAs, which is not something a pull
  # request should be blocked on. scripts/verify_benchpress_parity.py and
  # scripts/verify_method_comparison_parity.py live there for the same reason.
  #
  # NOTE: experiments/run_probe_compression.py and
  # experiments/run_probe_selection.py are multi-hour research jobs and are
  # deliberately NOT run in CI. Their outputs are committed artifacts and are
  # validated indirectly by the freshness check above.
